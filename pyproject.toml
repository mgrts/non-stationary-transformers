[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "non-stationary-transformers"
version = "0.1.0"
description = "Non-stationary time series prediction using transformer neural networks"
authors = [{ name = "Mikhail Gritskikh" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9,<3.14"

# Runtime dependencies needed to generate data, train, and evaluate.
dependencies = [
    "click>=8.0",
    "matplotlib>=3.8",
    "mlflow>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "python-dotenv>=0.5.1",
    "requests>=2.28",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "torch>=2.6",
    "tqdm>=4.60",
]

[project.optional-dependencies]
# Optional S3 data sync (Makefile sync_data_* targets): poetry install --extras aws
aws = ["awscli>=1.32"]

[tool.poetry]
# Keep the historical top-level `src` import package (e.g. `from src.config import ...`).
packages = [{ include = "src" }]

# Dev tooling: installed by default with `poetry install`; skip via --without dev.
[tool.poetry.group.dev.dependencies]
black = ">=24.0"
coverage = ">=7.0"
flake8 = ">=7.0"
isort = ">=5.12"
pre-commit = ">=3.0"

# Docs build: optional group, install with `poetry install --with docs`.
[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
Sphinx = ">=7.0"

[tool.black]
line-length = 99
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 99
